# FileDeck: web (nginx + SPA), api, worker, postgres.
# Only `web` is published. Put HTTPS (Nginx Proxy Manager) in front of it.
# First run:  ./scripts/init-secrets.sh && cp .env.example .env && docker compose up -d --build

name: ${COMPOSE_PROJECT_NAME:-filedeck}

x-server-common: &server-common
  restart: unless-stopped
  user: "${FILEDECK_UID:-1000}:${FILEDECK_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  depends_on:
    postgres: { condition: service_healthy }
  environment: &server-env
    NODE_ENV: production
    PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. https://filedeck.example.com}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL_FILE: /run/secrets/database_url
    CSRF_SECRET_FILE: /run/secrets/csrf_secret
    CREDENTIAL_KEYS_FILE: /run/secrets/credential_keys
    CREDENTIAL_ACTIVE_KEY_VERSION: ${CREDENTIAL_ACTIVE_KEY_VERSION:-1}
    SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-24}
    SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-filedeck_session}
    UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-8388608}
    MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-3}
    TRANSFER_STAGING_RETENTION_HOURS: ${TRANSFER_STAGING_RETENTION_HOURS:-72}
    SFTP_CONNECTION_TIMEOUT_MS: ${SFTP_CONNECTION_TIMEOUT_MS:-10000}
    SFTP_MAX_CONNECTIONS_PER_SERVER: ${SFTP_MAX_CONNECTIONS_PER_SERVER:-4}
    AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
    TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1099511627776}
    STAGING_MIN_FREE_BYTES: ${STAGING_MIN_FREE_BYTES:-1073741824}
    USER_ACTIVE_UPLOADS: ${USER_ACTIVE_UPLOADS:-10}
    USER_STAGING_QUOTA_BYTES: ${USER_STAGING_QUOTA_BYTES:-214748364800}
    MAX_CONCURRENT_CHUNK_WRITES: ${MAX_CONCURRENT_CHUNK_WRITES:-8}
    ZIP_MAX_BYTES: ${ZIP_MAX_BYTES:-21474836480}
    ZIP_MAX_ENTRIES: ${ZIP_MAX_ENTRIES:-10000}
    TRANSFER_HISTORY_DAYS: ${TRANSFER_HISTORY_DAYS:-30}
    SSE_MAX_CONNECTIONS_PER_USER: ${SSE_MAX_CONNECTIONS_PER_USER:-5}
    SERVER_COPY_MAX_ENTRIES: ${SERVER_COPY_MAX_ENTRIES:-100000}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
    MFA_CONNECT_TIMEOUT_SECONDS: ${MFA_CONNECT_TIMEOUT_SECONDS:-120}
    TERMINAL_IDLE_MINUTES: ${TERMINAL_IDLE_MINUTES:-30}
    TERMINAL_MAX_HOURS: ${TERMINAL_MAX_HOURS:-12}
    TERMINAL_MAX_PER_USER: ${TERMINAL_MAX_PER_USER:-3}
    TERMINAL_MAX_PER_SERVER: ${TERMINAL_MAX_PER_SERVER:-8}
    MONITOR_IDLE_SECONDS: ${MONITOR_IDLE_SECONDS:-30}
    MONITOR_SAMPLES_PER_MINUTE: ${MONITOR_SAMPLES_PER_MINUTE:-120}
    EDITOR_MAX_BYTES: ${EDITOR_MAX_BYTES:-5242880}
    EDITOR_LARGE_MAX_BYTES: ${EDITOR_LARGE_MAX_BYTES:-20971520}
    EDITOR_READONLY_HEAD_BYTES: ${EDITOR_READONLY_HEAD_BYTES:-1048576}
    COPY_INLINE_MAX_BYTES: ${COPY_INLINE_MAX_BYTES:-1073741824}
    COPY_INLINE_MAX_ENTRIES: ${COPY_INLINE_MAX_ENTRIES:-10000}
    PREVIEW_MAX_IMAGE_BYTES: ${PREVIEW_MAX_IMAGE_BYTES:-26214400}
    LOCAL_MOUNT_BASES: /mnt
    STAGING_DIR: /var/lib/filedeck/staging
  secrets: [database_url, csrf_secret, credential_keys]
  volumes:
    - staging:/var/lib/filedeck/staging
    # --- Local roots. The API can only ever expose paths under /mnt (LOCAL_MOUNT_BASES): add one line per
    # --- directory you want to browse, in BOTH api and worker. Use :ro for data FileDeck must never change.
    - ${FILEDECK_DATA_DIR:-./data/files}:/mnt/data

services:
  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    image: filedeck-web:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp", "/var/cache/nginx"]
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${FILEDECK_BIND:-127.0.0.1}:${FILEDECK_HTTP_PORT:-8088}:8080"

  api:
    <<: *server-common
    build: { context: ., dockerfile: docker/Dockerfile, target: api }
    image: filedeck-api:local
    environment:
      <<: *server-env
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      RUN_MIGRATIONS: "true"
    secrets: [database_url, csrf_secret, credential_keys, admin_password]

  worker:
    <<: *server-common
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    image: filedeck-worker:local
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy } # api applies migrations first

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filedeck
      POSTGRES_DB: filedeck
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filedeck -d filedeck"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    # no `ports:` on purpose: the database is reachable only from this Compose network

volumes:
  pgdata:
  staging:

secrets:
  postgres_password: { file: "${FILEDECK_SECRETS_DIR:-./secrets}/postgres_password" }
  database_url: { file: "${FILEDECK_SECRETS_DIR:-./secrets}/database_url" }
  csrf_secret: { file: "${FILEDECK_SECRETS_DIR:-./secrets}/csrf_secret" }
  credential_keys: { file: "${FILEDECK_SECRETS_DIR:-./secrets}/credential_keys" }
  admin_password: { file: "${FILEDECK_SECRETS_DIR:-./secrets}/admin_password" }
